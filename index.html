<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Animation</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      background-color: #000000;
    }

    body {
      height: 600vh;
      overscroll-behavior: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      const FRAME_COUNT = 241;
      const FRAME_PATH = (index) =>
        `photos_zip/ezgif-frame-${String(index + 1).padStart(3, '0')}.jpg`;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      const frames = new Array(FRAME_COUNT);
      const ready = new Uint8Array(FRAME_COUNT);

      let width = 0;
      let height = 0;
      let targetProgress = 0;
      let currentProgress = 0;
      let lastDrawnFrame = -1;
      let lastTime = performance.now();
      let rafId = 0;

      function updateScrollTarget() {
        const maxScroll =
          document.documentElement.scrollHeight - window.innerHeight;
        targetProgress =
          maxScroll > 0
            ? Math.min(1, Math.max(0, window.scrollY / maxScroll))
            : 0;
        scheduleRender();
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        lastDrawnFrame = -1;
        updateScrollTarget();
      }

      function findNearestReady(index) {
        if (ready[index]) return index;
        for (let offset = 1; offset < FRAME_COUNT; offset++) {
          if (index - offset >= 0 && ready[index - offset]) {
            return index - offset;
          }
          if (index + offset < FRAME_COUNT && ready[index + offset]) {
            return index + offset;
          }
        }
        return -1;
      }

      function drawImageFitted(img, alpha) {
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const viewAspect = width / height;
        const useCover = viewAspect >= 1;

        let drawW, drawH;
        if (useCover ? viewAspect > imgAspect : viewAspect < imgAspect) {
          drawW = width;
          drawH = width / imgAspect;
        } else {
          drawH = height;
          drawW = height * imgAspect;
        }

        const x = (width - drawW) * 0.5;
        const y = (height - drawH) * 0.5;

        ctx.globalAlpha = alpha;
        ctx.drawImage(img, x, y, drawW, drawH);
      }

      function drawFrame(exactFrame) {
        const indexA = Math.min(FRAME_COUNT - 1, Math.floor(exactFrame));
        const indexB = Math.min(FRAME_COUNT - 1, indexA + 1);
        const blend = exactFrame - indexA;

        const resolvedA = findNearestReady(indexA);
        if (resolvedA === -1) return;

        ctx.globalAlpha = 1;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, width, height);

        drawImageFitted(frames[resolvedA], 1);

        if (
          resolvedA === indexA &&
          indexB !== indexA &&
          blend > 0.01 &&
          ready[indexB]
        ) {
          drawImageFitted(frames[indexB], blend);
        }

        ctx.globalAlpha = 1;
        lastDrawnFrame = exactFrame;
      }

      function render(now) {
        rafId = 0;
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        const diff = targetProgress - currentProgress;
        if (Math.abs(diff) < 0.0001) {
          currentProgress = targetProgress;
        } else {
          const ease = 1 - Math.exp(-10 * dt);
          currentProgress += diff * ease;
        }

        const exactFrame = currentProgress * (FRAME_COUNT - 1);
        if (Math.abs(exactFrame - lastDrawnFrame) > 0.001) {
          drawFrame(exactFrame);
        }

        if (currentProgress !== targetProgress) {
          rafId = requestAnimationFrame(render);
        }
      }

      function scheduleRender() {
        if (!rafId) {
          lastTime = performance.now();
          rafId = requestAnimationFrame(render);
        }
      }

      function loadFrame(index) {
        return new Promise((resolve) => {
          const img = new Image();
          img.decoding = 'async';
          img.src = FRAME_PATH(index);
          frames[index] = img;

          const markReady = () => {
            ready[index] = 1;
            if (index === 0 || Math.abs(currentProgress * (FRAME_COUNT - 1) - index) < 2) {
              lastDrawnFrame = -1;
              scheduleRender();
            }
            resolve();
          };

          img.onload = () => {
            if (typeof img.decode === 'function') {
              img.decode().then(markReady, markReady);
            } else {
              markReady();
            }
          };
          img.onerror = resolve;
        });
      }

      async function preloadFrames() {
        await loadFrame(0);
        const concurrency = 16;
        let nextIndex = 1;

        async function worker() {
          while (nextIndex < FRAME_COUNT) {
            const idx = nextIndex++;
            await loadFrame(idx);
          }
        }

        const workers = Array.from({ length: concurrency }, worker);
        await Promise.all(workers);
      }

      window.addEventListener('scroll', updateScrollTarget, { passive: true });
      window.addEventListener('resize', resizeCanvas, { passive: true });

      resizeCanvas();
      preloadFrames();
    })();
  </script>
</body>
</html>
